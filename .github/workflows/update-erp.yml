name: Update ERP rates

on:
  schedule:
    - cron: "15 22 * * *"   # every day at 6:15am Singapore time
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch rates from LTA DataMall
        env:
          DATAMALL_KEY: ${{ secrets.DATAMALL_KEY }}
        run: node erp/fetch-erp.mjs
      - name: Save changes
        run: |
          git config user.name "erp-bot"
          git config user.email "erp-bot@users.noreply.github.com"
          git add erp/erp-rates.json
          git diff --cached --quiet && echo "Nothing to save" && exit 0
          git commit -m "Update ERP rates"
          git push
      - name: Refresh the jsDelivr copy
        run: curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/erp/erp-rates.json" || true
